<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Bank card support</title>
<style>
  :root {
    --ink: #1c2430; --muted: #5d6b7a; --line: #dde3ea; --paper: #f5f7fa;
    --agent: #ffffff; --customer: #1f4fd1; --accent: #1f4fd1; --ok: #127a3d; --warn: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 20px 24px; height: calc(100vh - 78px); }
  section { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  section > h2 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .customer { align-self: flex-end; background: var(--customer); color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .agent.error { color: var(--warn); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-size: 12px; }
  button.reject { background: #fff; color: var(--warn); border: 1px solid var(--warn); }
  button:disabled { opacity: .5; cursor: default; }
  #app { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 24px; }
  .request { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .request p { margin: 0 0 10px; }
  .request .actions { display: flex; gap: 8px; }
  .note { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--paper); }
  .note.ok { color: var(--ok); } .note.refused { color: var(--warn); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #chat { min-height: 50vh; } }
</style>
</head>
<body>
<header>
  <h1>Kestrel Bank card support</h1>
  <p>You are Ana Souza: customer number C-1001, born 1990-05-17, postcode SW1A 1AA. Your credit card was frozen by the fraud team, and your debit card has four recent transactions you could dispute.</p>
</header>
<main>
  <section aria-label="Chat with the support agent">
    <h2>Chat with the agent <button class="secondary" id="restart" type="button">New conversation</button></h2>
    <div id="chat" aria-live="polite"></div>
    <form id="composer">
      <input id="message" autocomplete="off" placeholder="Write to the agent…" aria-label="Your message" required>
      <button id="send">Send</button>
    </form>
  </section>
  <section aria-label="Your Kestrel Bank app">
    <h2>Your Kestrel Bank app</h2>
    <div id="app"><p class="empty">Nothing to confirm.</p></div>
  </section>
</main>
<script>
const chat = document.getElementById("chat");
const app = document.getElementById("app");
const composer = document.getElementById("composer");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const notes = [];

function bubble(speaker, text) {
  const element = document.createElement("div");
  element.className = `bubble ${speaker}`;
  element.textContent = text;
  chat.append(element);
  chat.scrollTop = chat.scrollHeight;
  return element;
}

async function conversation() {
  let id = localStorage.getItem("conversation");
  if (!id) {
    id = (await (await fetch("/api/conversations", { method: "POST" })).json()).id;
    localStorage.setItem("conversation", id);
  }
  return id;
}

async function loadHistory() {
  const id = await conversation();
  const { messages } = await (await fetch(`/api/conversations/${id}/messages`)).json();
  chat.replaceChildren();
  for (const { speaker, text } of messages) bubble(speaker, text);
}

async function send(text) {
  const id = await conversation();
  bubble("customer", text);
  const reply = bubble("agent", "…");
  sendButton.disabled = true;
  let written = "";
  const response = await fetch(`/api/conversations/${id}/messages`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    const events = buffer.split("\n\n");
    buffer = events.pop();
    for (const raw of events) {
      const name = raw.match(/^event: (.*)$/m)?.[1];
      const data = JSON.parse(raw.match(/^data: (.*)$/m)?.[1] ?? "{}");
      if (name === "delta") { written += data.text; reply.textContent = written; }
      if (name === "done") reply.textContent = data.reply;
      if (name === "error") { reply.textContent = data.message; reply.classList.add("error"); }
    }
    chat.scrollTop = chat.scrollHeight;
  }
  sendButton.disabled = false;
  refreshApp();
}

async function answer(id, choice) {
  const response = await fetch(`/api/app/pending-actions/${id}/${choice}`, { method: "POST" });
  if (response.status === 204) {
    notes.unshift({ ok: true, text: choice === "confirm" ? "Confirmed." : "Rejected." });
  } else {
    const refusal = await response.json();
    notes.unshift({ ok: false, text: refusal.message ?? "The bank refused that." });
  }
  refreshApp();
}

async function refreshApp() {
  const { pending_actions } = await (await fetch("/api/app/pending-actions")).json();
  const children = [];
  for (const action of pending_actions) {
    const card = document.createElement("div");
    card.className = "request";
    const summary = document.createElement("p");
    summary.textContent = action.summary;
    const actions = document.createElement("div");
    actions.className = "actions";
    const confirm = document.createElement("button");
    confirm.textContent = "Confirm";
    confirm.onclick = () => answer(action.id, "confirm");
    const reject = document.createElement("button");
    reject.textContent = "Reject";
    reject.className = "reject";
    reject.onclick = () => answer(action.id, "reject");
    actions.append(confirm, reject);
    card.append(summary, actions);
    children.push(card);
  }
  for (const note of notes.slice(0, 3)) {
    const element = document.createElement("p");
    element.className = `note ${note.ok ? "ok" : "refused"}`;
    element.textContent = note.text;
    children.push(element);
  }
  if (!children.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nothing to confirm.";
    children.push(empty);
  }
  app.replaceChildren(...children);
}

composer.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});
document.getElementById("restart").addEventListener("click", () => {
  localStorage.removeItem("conversation");
  notes.length = 0;
  loadHistory();
});

loadHistory();
refreshApp();
setInterval(refreshApp, 2000);
</script>
</body>
</html>
