# USD per million tokens, copied from each provider's pricing page on `checked_on`.
# A run refuses to start with a model that is missing here (ADR-0020). Where a provider's
# cache price is unknown, it equals the input price: that overestimates the cost, which
# keeps every cap on the safe side.
checked_on = 2026-10-27

# Anthropic: prices for prompts of at most 100K tokens; cache writes use the 5-minute TTL.
[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00

[models.claude-fable-5-1]
input = 10.00
output = 50.00
cache_read = 0.25
cache_write = 12.50

# OpenAI: launch prices of the GPT-5.4 small models.
[models."gpt-5.4-mini"]
input = 0.75
output = 4.50
cache_read = 0.75
cache_write = 0.75

[models."gpt-5.4-nano"]
input = 0.20
output = 1.25
cache_read = 0.20
cache_write = 0.20
