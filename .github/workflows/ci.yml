name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sparring
          POSTGRES_PASSWORD: sparring
          POSTGRES_DB: sparring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparring"
          --health-interval 2s
          --health-retries 15
    env:
      SPARRING_TEST_DATABASE_URL: postgresql+asyncpg://sparring:sparring@localhost:5432/sparring
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Browser for the demo page's end-to-end test
        run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
      - name: No ponytail comments
        run: "! grep -rIni ponytail src tests scripts"
      - name: Policy changes come with Canonical Cases (ADR-0018)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -qx 'src/sparring/agent/policy.md' <<<"$changed" && ! grep -q '^canonical_cases/' <<<"$changed"; then
            echo "::error::A change to the Policy must add or change Canonical Cases (ADR-0018)."
            exit 1
          fi
