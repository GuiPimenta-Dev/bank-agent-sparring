[project]
name = "sparring"
version = "0.1.0"
description = "A bank card-support agent stress-tested by simulated users; failures automatically grow a Langfuse golden set."
readme = "CLAUDE.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparring"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "sparring"

[[tool.importlinter.contracts]]
name = "Bank layers: adapters on application on domain"
type = "layers"
layers = [
    "sparring.bank.adapters",
    "sparring.bank.application",
    "sparring.bank.domain",
]
