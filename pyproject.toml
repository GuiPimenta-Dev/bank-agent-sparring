[project]
name = "sparring"
version = "0.1.0"
description = "A bank card-support agent stress-tested by simulated users; failures automatically grow a Langfuse golden set."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.17.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "openai>=3.39.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
sparring-chat = "sparring.chat:main"
sparring-run-scenario = "sparring.run_scenario:main"
sparring-explore = "sparring.explore:main"
sparring-failures = "sparring.failures:main"
sparring-regression-check = "sparring.check_regressions:main"
sparring-sweep = "sparring.sweep:main"
sparring-bank = "sparring.bank_service:main"
sparring-api = "sparring.agent_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparring"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "playwright>=1.64.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]

[tool.importlinter]
root_package = "sparring"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Bank layers: adapters on application on domain"
type = "layers"
layers = [
    "sparring.bank.adapters",
    "sparring.bank.application",
    "sparring.bank.domain",
]

[[tool.importlinter.contracts]]
name = "The agent reaches the bank only through MCP"
type = "forbidden"
source_modules = ["sparring.agent"]
forbidden_modules = ["sparring.bank"]

[[tool.importlinter.contracts]]
name = "The bank knows nothing of the agent"
type = "forbidden"
source_modules = ["sparring.bank"]
forbidden_modules = ["sparring.agent", "sparring.evaluation", "sparring.chat", "sparring.run_scenario", "sparring.explore", "sparring.failures", "sparring.check_regressions", "sparring.sweep", "sparring.bank_service", "sparring.agent_api", "sparring.demo", "sparring.system_under_test", "sparring.tracing"]

[[tool.importlinter.contracts]]
name = "LangGraph and LangChain stay inside the agent"
type = "forbidden"
source_modules = ["sparring.bank", "sparring.evaluation", "sparring.chat", "sparring.run_scenario", "sparring.explore", "sparring.failures", "sparring.check_regressions", "sparring.sweep", "sparring.bank_service", "sparring.agent_api", "sparring.demo", "sparring.system_under_test", "sparring.tracing"]
forbidden_modules = ["langgraph", "langchain", "langchain_core", "langchain_anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Evaluation sees only the bank's domain"
type = "forbidden"
source_modules = ["sparring.evaluation"]
forbidden_modules = ["sparring.bank.application", "sparring.bank.adapters", "sparring.agent"]

[[tool.importlinter.contracts]]
name = "Nothing but composition roots imports evaluation"
type = "forbidden"
source_modules = ["sparring.bank", "sparring.agent"]
forbidden_modules = ["sparring.evaluation"]

[[tool.importlinter.contracts]]
name = "The OpenAI SDK stays inside evaluation"
type = "forbidden"
source_modules = ["sparring.bank", "sparring.agent", "sparring.chat", "sparring.system_under_test", "sparring.tracing"]
forbidden_modules = ["openai"]
allow_indirect_imports = true
