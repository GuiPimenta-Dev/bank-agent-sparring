# A throwaway Postgres for the repository contract suite:
#   docker compose -f infra/postgres/docker-compose.yml up -d --wait
#   SPARRING_TEST_DATABASE_URL=postgresql+asyncpg://sparring:sparring@localhost:55432/sparring uv run pytest
name: sparring-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sparring
      POSTGRES_PASSWORD: sparring
      POSTGRES_DB: sparring
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparring"]
      interval: 2s
      retries: 15
